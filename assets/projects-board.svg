<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Featured academic projects</title><desc id="desc">Employee Absenteeism Analysis, CareLink, Hidden Places, and TripSystem.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102d4a"/></linearGradient><linearGradient id="cyan"><stop stop-color="#35c5f0"/><stop offset="1" stop-color="#4f8cff"/></linearGradient><linearGradient id="purple"><stop stop-color="#8b7cf6"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><text x="48" y="58" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="700">FEATURED PROJECTS</text><text x="48" y="85" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="15" letter-spacing="2">ACADEMIC WORK • VERIFIED CONTRIBUTIONS • PRACTICAL OUTCOMES</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial">
    <g transform="translate(48 118)"><rect width="536" height="220" rx="20" fill="#0c2540" stroke="#2d5d7e"/><rect width="8" height="220" rx="4" fill="url(#cyan)"/><circle cx="54" cy="53" r="25" fill="#123b5e"/><text x="54" y="61" text-anchor="middle" fill="#7dd3fc" font-size="25">📊</text><text x="95" y="49" fill="#f8fafc" font-size="23" font-weight="700">Employee Absenteeism Analysis</text><text x="95" y="76" fill="#7dd3fc" font-size="14">STATISTICAL MODELLING CONSULTANCY</text><text x="34" y="120" fill="#cbd5e1" font-size="16">8,336 employee records analysed through data-quality</text><text x="34" y="146" fill="#cbd5e1" font-size="16">assessment, EDA, statistical testing, and regression.</text><g transform="translate(34 174)" font-size="13" font-weight="600"><rect width="142" height="28" rx="14" fill="#143b5c"/><text x="71" y="19" text-anchor="middle" fill="#dff6ff">REGRESSION</text><rect x="152" width="88" height="28" rx="14" fill="#143b5c"/><text x="196" y="19" text-anchor="middle" fill="#dff6ff">EDA</text><rect x="250" width="180" height="28" rx="14" fill="#143b5c"/><text x="340" y="19" text-anchor="middle" fill="#dff6ff">MODEL EVALUATION</text></g></g>
    <g transform="translate(616 118)"><rect width="536" height="220" rx="20" fill="#0c2540" stroke="#554b86"/><rect width="8" height="220" rx="4" fill="url(#purple)"/><circle cx="54" cy="53" r="25" fill="#292650"/><text x="54" y="61" text-anchor="middle" fill="#c4b5fd" font-size="25">🏥</text><text x="95" y="49" fill="#f8fafc" font-size="23" font-weight="700">CareLink Platform</text><text x="95" y="76" fill="#c4b5fd" font-size="14">INTEGRATED HEALTHCARE ECOSYSTEM</text><text x="34" y="120" fill="#cbd5e1" font-size="16">My responsibility: Pharmacy Dispensing Unit workflows,</text><text x="34" y="146" fill="#cbd5e1" font-size="16">inventory monitoring, prescriptions, and restocking.</text><g transform="translate(34 174)" font-size="13" font-weight="600"><rect width="90" height="28" rx="14" fill="#292650"/><text x="45" y="19" text-anchor="middle" fill="#ede9fe">REACT</text><rect x="100" width="132" height="28" rx="14" fill="#292650"/><text x="166" y="19" text-anchor="middle" fill="#ede9fe">SPRING BOOT</text><rect x="242" width="92" height="28" rx="14" fill="#292650"/><text x="288" y="19" text-anchor="middle" fill="#ede9fe">PYTHON</text><rect x="344" width="86" height="28" rx="14" fill="#292650"/><text x="387" y="19" text-anchor="middle" fill="#ede9fe">MYSQL</text></g></g>
    <g transform="translate(48 370)"><rect width="536" height="220" rx="20" fill="#0c2540" stroke="#2d5d7e"/><rect width="8" height="220" rx="4" fill="url(#cyan)"/><circle cx="54" cy="53" r="25" fill="#123b5e"/><text x="54" y="61" text-anchor="middle" fill="#7dd3fc" font-size="25">📍</text><text x="95" y="49" fill="#f8fafc" font-size="23" font-weight="700">Hidden Places</text><text x="95" y="76" fill="#7dd3fc" font-size="14">MOBILE TRAVEL DISCOVERY APPLICATION</text><text x="34" y="120" fill="#cbd5e1" font-size="16">A Sri Lankan travel-discovery application. My role</text><text x="34" y="146" fill="#cbd5e1" font-size="16">focused on Travel Guide Management.</text><g transform="translate(34 174)" font-size="13" font-weight="600"><rect width="126" height="28" rx="14" fill="#143b5c"/><text x="63" y="19" text-anchor="middle" fill="#dff6ff">REACT NATIVE</text><rect x="136" width="76" height="28" rx="14" fill="#143b5c"/><text x="174" y="19" text-anchor="middle" fill="#dff6ff">EXPO</text><rect x="222" width="98" height="28" rx="14" fill="#143b5c"/><text x="271" y="19" text-anchor="middle" fill="#dff6ff">NODE.JS</text><rect x="330" width="100" height="28" rx="14" fill="#143b5c"/><text x="380" y="19" text-anchor="middle" fill="#dff6ff">MONGODB</text></g></g>
    <g transform="translate(616 370)"><rect width="536" height="220" rx="20" fill="#0c2540" stroke="#554b86"/><rect width="8" height="220" rx="4" fill="url(#purple)"/><circle cx="54" cy="53" r="25" fill="#292650"/><text x="54" y="61" text-anchor="middle" fill="#c4b5fd" font-size="25">🧳</text><text x="95" y="49" fill="#f8fafc" font-size="23" font-weight="700">TripSystem</text><text x="95" y="76" fill="#c4b5fd" font-size="14">JAVA TRAVEL-BOOKING SYSTEM</text><text x="34" y="120" fill="#cbd5e1" font-size="16">Public contribution history includes Java and JSP</text><text x="34" y="146" fill="#cbd5e1" font-size="16">components supporting booking functionality.</text><g transform="translate(34 174)" font-size="13" font-weight="600"><rect width="78" height="28" rx="14" fill="#292650"/><text x="39" y="19" text-anchor="middle" fill="#ede9fe">JAVA</text><rect x="88" width="66" height="28" rx="14" fill="#292650"/><text x="121" y="19" text-anchor="middle" fill="#ede9fe">JSP</text><rect x="164" width="132" height="28" rx="14" fill="#292650"/><text x="230" y="19" text-anchor="middle" fill="#ede9fe">SPRING BOOT</text><rect x="306" width="86" height="28" rx="14" fill="#292650"/><text x="349" y="19" text-anchor="middle" fill="#ede9fe">MYSQL</text></g></g>
  </g>
</svg>
